<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凱基人壽保險商品導覽</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: #f0f4f8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
  }

  /* ── 密碼遮罩 ── */
  #pw-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #1a3a6b, #0e2244);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 24px;
  }
  #pw-screen h2 {
    color: #fff;
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 6px;
    text-align: center;
  }
  #pw-screen p {
    color: rgba(255,255,255,.7);
    font-size: 13px;
    margin-bottom: 28px;
    text-align: center;
  }
  #pw-box {
    background: rgba(255,255,255,.12);
    border-radius: 16px;
    padding: 28px 24px;
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #pw-input {
    width: 100%;
    padding: 13px 16px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    letter-spacing: 3px;
    text-align: center;
    outline: none;
    background: #fff;
    color: #1a3a6b;
  }
  #pw-btn {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: #fff;
    color: #1a3a6b;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }
  #pw-btn:active { opacity: .85; }
  #pw-err {
    color: #ffb3b3;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }

  /* ── 主內容（預設隱藏） ── */
  #main { display: none; width: 100%; max-width: 400px; }
  h1 {
    font-size: 20px;
    color: #1a3a6b;
    text-align: center;
    margin-bottom: 8px;
    font-weight: 800;
  }
  p.sub {
    font-size: 13px;
    color: #666;
    text-align: center;
    margin-bottom: 32px;
  }
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
  }
  a.btn {
    display: block;
    text-align: center;
    padding: 18px 20px;
    border-radius: 14px;
    text-decoration: none;
    font-weight: 700;
    font-size: 16px;
    line-height: 1.4;
    box-shadow: 0 4px 14px rgba(0,0,0,.12);
  }
  a.btn-mobile {
    background: linear-gradient(135deg, #1a3a6b, #0e2244);
    color: #fff;
  }
  a.btn-desktop {
    background: #fff;
    color: #1a3a6b;
    border: 2px solid #1a3a6b;
  }
  .btn-icon { font-size: 22px; display: block; margin-bottom: 4px; }
  .btn-desc { font-size: 12px; font-weight: 400; opacity: .8; margin-top: 3px; }
</style>
</head>
<body>

<!-- 密碼畫面 -->
<div id="pw-screen">
  <h2>凱基人壽保險商品導覽</h2>
  <p>請輸入密碼以繼續</p>
  <div id="pw-box">
    <input id="pw-input" type="password" placeholder="請輸入密碼" autocomplete="off">
    <button id="pw-btn" onclick="checkPW()">確認進入</button>
    <div id="pw-err"></div>
  </div>
</div>

<!-- 主內容 -->
<div id="main">
  <h1>凱基人壽保險商品導覽</h1>
  <p class="sub">請選擇適合您裝置的版本</p>
  <div class="btn-group">
    <a class="btn btn-mobile" href="kgilife-mobile.html">
      <span class="btn-icon">📱</span>
      手機版
      <div class="btn-desc">字體較小，適合手機瀏覽</div>
    </a>
    <a class="btn btn-desktop" href="kgilife-pdf.html">
      <span class="btn-icon">💻</span>
      完整版（含 PDF）
      <div class="btn-desc">字體較大，適合平板或電腦</div>
    </a>
  </div>
</div>

<script>
  var _pw = 'QQ090';

  // 同一瀏覽器 session 已驗證過就直接顯示
  if (sessionStorage.getItem('kgi_auth') === '1') {
    document.getElementById('pw-screen').style.display = 'none';
    document.getElementById('main').style.display = 'block';
  }

  // Enter 鍵也能送出
  document.getElementById('pw-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkPW();
  });

  function checkPW() {
    var val = document.getElementById('pw-input').value;
    if (val === _pw) {
      sessionStorage.setItem('kgi_auth', '1');
      document.getElementById('pw-screen').style.display = 'none';
      document.getElementById('main').style.display = 'block';
    } else {
      document.getElementById('pw-err').textContent = '❌ 密碼錯誤，請重新輸入';
      document.getElementById('pw-input').value = '';
      document.getElementById('pw-input').focus();
    }
  }
</script>
</body>
</html>
