<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凱基人壽保險商品導覽</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: #f0f4f8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
  }
  h1 {
    font-size: 20px;
    color: #1a3a6b;
    text-align: center;
    margin-bottom: 8px;
    font-weight: 800;
  }
  p.sub {
    font-size: 13px;
    color: #666;
    text-align: center;
    margin-bottom: 32px;
  }
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 340px;
  }
  a.btn {
    display: block;
    text-align: center;
    padding: 18px 20px;
    border-radius: 14px;
    text-decoration: none;
    font-weight: 700;
    font-size: 16px;
    line-height: 1.4;
    box-shadow: 0 4px 14px rgba(0,0,0,.12);
    transition: transform .15s, box-shadow .15s;
  }
  a.btn:active { transform: scale(.97); box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  a.btn-mobile {
    background: linear-gradient(135deg, #1a3a6b, #0e2244);
    color: #fff;
  }
  a.btn-desktop {
    background: #fff;
    color: #1a3a6b;
    border: 2px solid #1a3a6b;
  }
  .btn-icon { font-size: 22px; display: block; margin-bottom: 4px; }
  .btn-desc { font-size: 12px; font-weight: 400; opacity: .8; margin-top: 3px; }
</style>
</head>
<body>
  <h1>凱基人壽保險商品導覽</h1>
  <p class="sub">請選擇適合您裝置的版本</p>
  <div class="btn-group">
    <a class="btn btn-mobile" href="kgilife-mobile.html">
      <span class="btn-icon">📱</span>
      手機版
      <div class="btn-desc">字體較小，適合手機瀏覽</div>
    </a>
    <a class="btn btn-desktop" href="kgilife-pdf.html">
      <span class="btn-icon">💻</span>
      完整版（含 PDF）
      <div class="btn-desc">字體較大，適合平板或電腦</div>
    </a>
  </div>
</body>
</html>
